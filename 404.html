<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Rhodo is now Rivet</title>
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://nicomaggioli.github.io/rivet/" />
    <script>
      (function () {
        var rest = location.pathname.replace(/^\/rhodo(\/|$)/, "/");
        location.replace("/rivet" + rest + location.search + location.hash);
      })();
    </script>
    <meta http-equiv="refresh" content="0; url=/rivet/" />
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center;
             background: #0b0d11; color: #e8ebef; font: 16px/1.5 system-ui, sans-serif; }
      a { color: #65fc9f; }
    </style>
  </head>
  <body>
    <p>Rhodo is now Rivet. <a href="/rivet/">Continue to the new site</a>.</p>
  </body>
</html>
